spring.application.name=diy-shop
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/diyshop
spring.datasource.username=diyshop
spring.datasource.password=diyshop123
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.flyway.enabled=true
shop.shipping.flat-fee=30000
shop.seller.username=${DIY_SHOP_SELLER_USERNAME}
shop.seller.password-hash=${DIY_SHOP_SELLER_PASSWORD_HASH}
shop.image-storage.provider=${IMAGE_STORAGE_PROVIDER:local}
shop.image-storage.local-directory=${IMAGE_STORAGE_LOCAL_DIRECTORY:./uploads/product-images}
shop.image-storage.max-file-size=${IMAGE_STORAGE_MAX_FILE_SIZE:5MB}
shop.image-storage.s3.bucket=${IMAGE_STORAGE_S3_BUCKET:}
shop.image-storage.s3.region=${AWS_REGION:ap-southeast-1}
shop.image-storage.s3.presigned-url-duration-minutes=${IMAGE_STORAGE_S3_URL_DURATION_MINUTES:60}
shop.bank-transfer.bank-name=${BANK_TRANSFER_BANK_NAME}
shop.bank-transfer.bank-code=${BANK_TRANSFER_BANK_CODE}
shop.bank-transfer.bank-bin=${BANK_TRANSFER_BANK_BIN}
shop.bank-transfer.account-number=${BANK_TRANSFER_ACCOUNT_NUMBER}
shop.bank-transfer.account-name=${BANK_TRANSFER_ACCOUNT_NAME}
shop.bank-transfer.template=${BANK_TRANSFER_TEMPLATE:compact}
shop.bank-transfer.payment-due-hours=${BANK_TRANSFER_PAYMENT_DUE_HOURS:24}
spring.servlet.multipart.max-file-size=${shop.image-storage.max-file-size}
spring.servlet.multipart.max-request-size=6MB
