services:
  postgres:
    image: postgres:16
    container_name: diy-shop-postgres
    environment:
      POSTGRES_DB: diyshop
      POSTGRES_USER: diyshop
      POSTGRES_PASSWORD: diyshop123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: